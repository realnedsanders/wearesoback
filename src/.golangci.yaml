# golangci-lint configuration for the wasb module.
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: var-naming
        - name: unused-parameter
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
